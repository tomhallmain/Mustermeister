        success:
          one: "Moved %{count} project from \"%{from}\" to \"%{to}\"."
          other: "Moved %{count} projects from \"%{from}\" to \"%{to}\"."
        cleared:
          one: "Removed the category \"%{from}\" from %{count} project."
          other: "Removed the category \"%{from}\" from %{count} projects."
        no_changes: "No projects were changed. Choose a category and a different new name."
        failure: "Renaming the category failed and no projects were changed: %{message}"
